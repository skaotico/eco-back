name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - develop
      - test
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Buildx para Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Configurar Java y construir el JAR
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: ./gradlew clean build

      # 4. Login en GitLab Container Registry
      - name: Login to GitLab Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USER }}
          password: ${{ secrets.GITLAB_TOKEN }}

      # 5. Construir y subir imagen Docker
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:${{ github.ref_name }}
          file: ./Dockerfile

      # 6. Tag 'latest' si es main
      - name: Tag latest for main
        if: github.ref_name == 'main'
        run: |
          docker tag registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:main registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:latest
          docker push registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:latest
