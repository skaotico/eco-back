name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - develop
      - test
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: dockerhub-usuario/api-rest-java:${{ github.ref_name }}
          file: ./Dockerfile

      - name: Tag latest for main
        if: github.ref_name == 'main'
        run: |
          docker tag dockerhub-usuario/api-rest-java:main dockerhub-usuario/api-rest-java:latest
          docker push dockerhub-usuario/api-rest-java:latest
