name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - develop
      - test
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitLab Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USER }}
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:${{ github.ref_name }}
          file: ./Dockerfile

      - name: Tag latest for main
        if: github.ref_name == 'main'
        run: |
          docker tag registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:main registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:latest
          docker push registry.gitlab.com/mi-usuario/mi-proyecto/api-rest-java:latest
